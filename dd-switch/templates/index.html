<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude-GearShift</title>
<style>
  :root {
    --bg: #1a1b2e; --surface: #232540; --card: #2a2d4a;
    --border: #363a5a; --text: #e2e4f0; --muted: #888cad;
    --accent: #6366f1; --accent-hover: #5457e5; --danger: #ef4444;
    --success: #22c55e; --warning: #f59e0b;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header span { color: var(--muted); font-size: 13px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
  .badge-ok { background: rgba(34,197,94,.15); color: var(--success); }
  .badge-err { background: rgba(239,68,68,.15); color: var(--danger); }
  .container { display: flex; flex: 1; min-height: 0; }
  .sidebar {
    width: 300px; min-width: 300px; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .sidebar-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-header h2 { font-size: 14px; font-weight: 600; }
  .config-list { flex: 1; overflow-y: auto; padding: 8px; }
  .config-item {
    padding: 10px 12px; border-radius: var(--radius); cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background .15s;
    border: 1px solid transparent; margin-bottom: 4px;
  }
  .config-item:hover { background: rgba(99,102,241,.08); }
  .config-item.active { border-color: var(--accent); background: rgba(99,102,241,.12); }
  .config-item .name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .config-item .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  .config-item:hover .actions { opacity: 1; }
  .config-item .actions button {
    background: none; border: none; cursor: pointer; padding: 2px 4px;
    border-radius: 4px; font-size: 13px; color: var(--muted); line-height: 1;
  }
  .config-item .actions button:hover { background: rgba(255,255,255,.08); }
  .config-item .actions .btn-del:hover { color: var(--danger); }
  .main {
    flex: 1; display: flex; flex-direction: column; padding: 24px; gap: 16px;
    overflow-y: auto;
  }
  .current-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px;
  }
  .current-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--muted); }
  .current-card .row { display: flex; gap: 24px; font-size: 13px; }
  .current-card .row dt { color: var(--muted); } .current-card .row dd { color: var(--text); }
  .preview-area {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
  }
  .preview-area h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .preview-area textarea {
    flex: 1; width: 100%; min-height: 200px; resize: vertical;
    background: #13142a; color: #c9d1d9; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px; font-family: "JetBrains Mono", "Fira Code", monospace;
    font-size: 13px; line-height: 1.5; tab-size: 2;
  }
  .preview-area textarea:focus { outline: none; border-color: var(--accent); }
  .toolbar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .toolbar .file-name { font-size: 14px; font-weight: 500; flex: 1; }
  .btn {
    padding: 6px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    font-size: 13px; cursor: pointer; transition: all .15s; background: transparent; color: var(--text);
  }
  .btn:hover { background: rgba(255,255,255,.06); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: rgba(239,68,68,.1); }
  .btn-success { background: var(--success); border-color: var(--success); color: #fff; }
  .btn-success:hover { opacity: .9; }
  .btn-sm { padding: 3px 10px; font-size: 12px; }
  .toast {
    position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
    border-radius: var(--radius); font-size: 13px; z-index: 1000;
    transform: translateY(80px); opacity: 0; transition: all .3s;
    max-width: 400px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.info { background: var(--accent); color: #fff; }
  .toast.success { background: var(--success); color: #fff; }
  .toast.error { background: var(--danger); color: #fff; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
    align-items: center; justify-content: center; z-index: 999;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; max-width: 500px; width: 90%;
  }
  .modal h3 { margin-bottom: 12px; font-size: 16px; }
  .modal p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
  .modal .btns { display: flex; gap: 8px; justify-content: flex-end; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
  input[type="text"] {
    width: 100%; padding: 8px 12px; border-radius: var(--radius);
    border: 1px solid var(--border); background: #13142a; color: var(--text);
    font-size: 13px; margin-bottom: 12px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .json-error { color: var(--danger); font-size: 12px; margin-top: 4px; display: none; }
  .json-error.show { display: block; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--muted); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .lang-toggle {
    padding: 4px 12px; border-radius: var(--radius);
    border: 1px solid var(--border); background: transparent; color: var(--text);
    font-size: 12px; cursor: pointer;
  }
  .server-select {
    padding: 6px 10px; border-radius: var(--radius);
    border: 1px solid var(--border); background: #13142a; color: var(--text);
    font-size: 12px; cursor: pointer; width: 100%;
  }
  .server-select:focus { outline: none; border-color: var(--accent); }
  .server-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 500;
    background: rgba(99,102,241,.15); color: var(--accent);
  }
  .server-badge.remote {
    background: rgba(34,197,94,.15); color: var(--success);
  }
  .server-badge.local {
    background: rgba(136,140,173,.15); color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1>⚙️ Claude-GearShift</h1>
  <span data-i18n="subtitle">Claude Code 配置切换面板</span>
  <span class="badge badge-ok" id="countBadge">0</span>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <button class="lang-toggle" id="langToggle" onclick="I18N.toggleLang()">EN</button>
    <a href="logout" class="btn btn-sm" style="text-decoration:none" data-i18n="logout">退出登录</a>
  </div>
</header>

<div class="container">
  <!-- sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2 data-i18n="configFiles">配置文件</h2>
      <button class="btn btn-sm btn-primary" onclick="openNewConfig()" data-i18n="addNew">+ 新增</button>
    </div>
    <div style="padding:8px 12px;border-bottom:1px solid var(--border)">
      <select class="server-select" id="serverSelect" onchange="onServerChange()" style="width:100%">
        <option value="local" data-i18n="localServer">本地服务器</option>
      </select>
      <button class="btn btn-sm" onclick="openServerModal()" style="width:100%;margin-top:6px" data-i18n="manageServers">管理服务器</button>
    </div>
    <div class="config-list" id="configList">
      <div class="empty" data-i18n="loading">加载中...</div>
    </div>
  </div>

  <!-- main -->
  <div class="main">
    <div class="current-card" id="currentCard">
      <h3 data-i18n="currentConfig">当前使用中的配置</h3>
      <div id="currentInfo" data-i18n="loading">加载中...</div>
      <div id="currentOtherFields"></div>
    </div>

    <div class="preview-area">
      <div class="toolbar">
        <span class="file-name" id="fileName">选择一个配置</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm btn-success" id="btnSwitch" onclick="confirmSwitch()" style="display:none" data-i18n="switchTo">🔄 切换到此配置</button>
          <button class="btn btn-sm" id="btnSave" onclick="saveConfig()" style="display:none" data-i18n="save">💾 保存</button>
        </div>
      </div>
      <textarea id="editor" data-i18n-placeholder="selectHint" placeholder="选择左侧配置查看内容..." readonly></textarea>
      <div class="json-error" id="jsonError" data-i18n="jsonError">JSON 格式错误</div>
    </div>
  </div>
</div>

<!-- confirm modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <h3 data-i18n="confirmSwitch">确认切换配置</h3>
    <p id="confirmMsg"></p>
    <div class="btns">
      <button class="btn" onclick="closeModal()" data-i18n="cancel">取消</button>
      <button class="btn btn-primary" onclick="doSwitch()" id="confirmBtn" data-i18n="confirmBtn">确认切换</button>
    </div>
  </div>
</div>

<!-- new config modal -->
<div class="modal-overlay" id="newModal">
  <div class="modal">
    <h3 data-i18n="newConfig">新增配置</h3>
    <input type="text" id="newConfigName" data-i18n-placeholder="fileNamePlaceholder" placeholder="文件名（如 my_provider.json）" />
    <textarea id="newConfigContent" rows="8" style="width:100%;background:#13142a;color:#c9d1d9;border:1px solid var(--border);border-radius:var(--radius);padding:10px;font-family:monospace;font-size:13px;resize:vertical" data-i18n-placeholder="newConfigPlaceholder" placeholder='{"env":{"ANTHROPIC_BASE_URL":"...","ANTHROPIC_MODEL":"..."}}'></textarea>
    <div class="json-error" id="newJsonError" style="margin:4px 0 8px" data-i18n="jsonError">JSON 格式错误</div>
    <div class="btns">
      <button class="btn" onclick="closeNewModal()" data-i18n="cancel">取消</button>
      <button class="btn btn-primary" onclick="createConfig()" data-i18n="create">创建</button>
    </div>
  </div>
</div>

<!-- server management modal -->
<div class="modal-overlay" id="serverModal">
  <div class="modal" style="max-width:600px">
    <h3 data-i18n="manageServers">管理服务器</h3>
    <div id="serverList" style="max-height:300px;overflow-y:auto;margin-bottom:12px"></div>
    <div style="border-top:1px solid var(--border);padding-top:12px">
      <h4 style="font-size:13px;margin-bottom:8px;color:var(--muted)" data-i18n="addServer">添加服务器</h4>
      <input type="text" id="srvName" placeholder="名称" style="width:100%;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:#13142a;color:var(--text);font-size:13px;margin-bottom:8px" />
      <input type="text" id="srvHost" placeholder="主机地址" style="width:100%;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:#13142a;color:var(--text);font-size:13px;margin-bottom:8px" />
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input type="number" id="srvPort" placeholder="端口" value="22" style="width:80px;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:#13142a;color:var(--text);font-size:13px" />
        <input type="text" id="srvUsername" placeholder="用户名" style="flex:1;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:#13142a;color:var(--text);font-size:13px" />
      </div>
      <input type="text" id="srvKeyPath" placeholder="SSH 密钥路径" style="width:100%;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:#13142a;color:var(--text);font-size:13px;margin-bottom:8px" />
      <input type="password" id="srvPassphrase" placeholder="密钥密码短语（可选）" style="width:100%;padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:#13142a;color:var(--text);font-size:13px;margin-bottom:12px" />
      <div class="btns">
        <button class="btn" onclick="closeServerModal()" data-i18n="close">关闭</button>
        <button class="btn btn-primary" onclick="addServer()" data-i18n="add">添加</button>
      </div>
    </div>
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<script src="static/i18n.js"></script>
<script>
let configs = [];
let currentName = null;
let editing = false;
let isDirty = false;

// Re-render dynamic content after a language switch / 切换语言后重绘动态内容
function onLangChange() {
  // fileName holds a real file name once selected — only reset when empty
  if (!currentName) document.getElementById("fileName").textContent = t("selectConfig");
  loadAll();
}

// --- Toast ---
function toast(msg, type = "info") {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = `toast ${type}`;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3000);
}

// --- API ---
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  const data = await r.json();
  if (data.login_required) {
    window.location.href = "login";
    throw new Error(t("loginExpired"));
  }
  if (!r.ok) throw new Error(translateError(data.error) || t("requestFailed"));
  return data;
}

// --- Load ---
async function loadAll() {
  if (currentServer === "local") {
    await Promise.all([loadConfigs(), loadCurrent()]);
  } else {
    await Promise.all([loadRemoteConfigs(currentServer), loadRemoteCurrent(currentServer)]);
  }
}

async function loadConfigs() {
  const data = await api("GET", "api/configs");
  configs = data.valid;
  const el = document.getElementById("configList");
  const badge = document.getElementById("countBadge");
  const invalids = data.invalid || [];

  if (configs.length === 0 && invalids.length === 0) {
    el.innerHTML = `<div class="empty">${t("noConfigs")}<br/>${t("noConfigsHint")}</div>`;
    badge.textContent = t("configsUnit", 0);
    return;
  }

  let html = "";
  for (const c of configs) {
    const active = c.name === currentName ? ' active' : '';
    html += `<div class="config-item${active}" data-name="${c.name}" onclick="selectConfig('${c.name}')">
      <span class="name">${c.name}</span>
      <span class="actions">
        <button onclick="event.stopPropagation();selectConfig('${c.name}')" data-i18n-title="edit" title="编辑">✏️</button>
        <button class="btn-del" onclick="event.stopPropagation();deleteConfig('${c.name}')" data-i18n-title="delete" title="删除">🗑️</button>
      </span>
    </div>`;
  }
  for (const c of invalids) {
    html += `<div class="config-item" style="opacity:.5;cursor:default">
      <span class="name">${c.name} <span class="badge badge-err">${t("invalid")}</span></span>
    </div>`;
  }
  el.innerHTML = html;
  badge.textContent = t("configsUnit", configs.length);
  // re-apply title translations on the freshly injected nodes
  el.querySelectorAll("[data-i18n-title]").forEach((n) => {
    n.setAttribute("title", t(n.getAttribute("data-i18n-title")));
  });
}

async function loadCurrent() {
  try {
    const data = await api("GET", "api/current");
    const el = document.getElementById("currentInfo");
    const otherEl = document.getElementById("currentOtherFields");
    if (!data.exists) {
      el.innerHTML = `<span style="color:var(--warning)">${t("notCreated")}</span>`;
      otherEl.innerHTML = "";
      return;
    }
    currentName = null;
    // Display env vars as a table
    const env = data.env || {};
    const other = data.other_fields || {};
    let envHtml = '<table style="width:100%;font-size:13px;border-collapse:collapse">';
    for (const [key, val] of Object.entries(env)) {
      const displayVal = key === 'ANTHROPIC_AUTH_TOKEN' && val.length > 20
        ? val.substring(0, 12) + '...'
        : val;
      envHtml += `<tr style="border-bottom:1px solid var(--border)"><td style="padding:4px 8px 4px 0;color:var(--muted);white-space:nowrap;width:1%">${key}</td><td style="padding:4px 0;font-family:monospace;font-size:12px;word-break:break-all">${displayVal}</td></tr>`;
    }
    envHtml += '</table>';
    el.innerHTML = envHtml;

    let otherHtml = "";
    if (Object.keys(other).length > 0) {
      otherHtml = `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><h3 style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px">${t("otherFields")}</h3><table style="width:100%;font-size:13px;border-collapse:collapse">`;
      for (const [key, val] of Object.entries(other)) {
        const displayVal = typeof val === 'object' ? JSON.stringify(val) : String(val);
        otherHtml += `<tr style="border-bottom:1px solid var(--border)"><td style="padding:4px 8px 4px 0;color:var(--muted);white-space:nowrap;width:1%">${key}</td><td style="padding:4px 0;font-family:monospace;font-size:12px;word-break:break-all">${displayVal}</td></tr>`;
      }
      otherHtml += '</table></div>';
    }
    otherHtml += `<div style="margin-top:8px;font-size:12px;color:var(--muted)">📁 ${data.path}</div>`;
    otherEl.innerHTML = otherHtml;

    // try to guess which config matches
    if (env) {
      for (const c of configs) {
        try {
          const cd = await api("GET", `api/configs/${c.name}`);
          if (cd.content && cd.content.env && JSON.stringify(cd.content.env) === JSON.stringify(env)) {
            currentName = c.name;
            break;
          }
        } catch {}
      }
    }
    renderSidebar();
  } catch (e) {
    document.getElementById("currentInfo").textContent = `${t("readFailed")}: ${translateError(e.message)}`;
  }
}

function renderSidebar() {
  const el = document.getElementById("configList");
  let html = "";
  for (const c of configs) {
    const active = c.name === currentName ? ' active' : '';
    html += `<div class="config-item${active}" data-name="${c.name}" onclick="selectConfig('${c.name}')">
      <span class="name">${c.name}${c.name === currentName ? ' ⬅️' : ''}</span>
      <span class="actions">
        <button onclick="event.stopPropagation();selectConfig('${c.name}')" data-i18n-title="edit" title="编辑">✏️</button>
        <button class="btn-del" onclick="event.stopPropagation();deleteConfig('${c.name}')" data-i18n-title="delete" title="删除">🗑️</button>
      </span>
    </div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll("[data-i18n-title]").forEach((n) => {
    n.setAttribute("title", t(n.getAttribute("data-i18n-title")));
  });
}

// --- Select / Preview ---
async function selectConfig(name) {
  currentName = name;
  editing = false; isDirty = false;
  try {
    const data = await api("GET", `api/configs/${name}`);
    document.getElementById("fileName").textContent = name;
    const editor = document.getElementById("editor");
    editor.value = JSON.stringify(data.content, null, 2);
    editor.readOnly = false;
    document.getElementById("btnSwitch").style.display = "inline-block";
    document.getElementById("btnSave").style.display = "none";
    document.getElementById("jsonError").classList.remove("show");
    renderSidebar();
  } catch (e) {
    toast(translateError(e.message), "error");
  }
}

// --- Switch ---
let switchingName = null;
function confirmSwitch() {
  if (!currentName) return;
  switchingName = currentName;
  document.getElementById("confirmMsg").textContent = t("confirmMsg", currentName);
  document.getElementById("confirmModal").classList.add("show");
}

function closeModal() {
  document.getElementById("confirmModal").classList.remove("show");
}

async function doSwitch() {
  const btn = document.getElementById("confirmBtn");
  btn.disabled = true; btn.textContent = t("switching");
  try {
    if (currentServer === "local") {
      await api("POST", "api/switch", { name: switchingName });
      toast(t("switchedTo", switchingName), "success");
      closeModal();
      await loadCurrent();
    } else {
      const content = JSON.parse(document.getElementById("editor").value);
      await doRemoteSwitch(currentServer, content);
      closeModal();
    }
  } catch (e) {
    toast(`❌ ${translateError(e.message)}`, "error");
  }
  btn.disabled = false; btn.textContent = t("confirmBtn");
}

// --- Edit (inline) ---
document.getElementById("editor").addEventListener("input", function () {
  if (!currentName) return;
  editing = true;
  isDirty = true;
  document.getElementById("btnSwitch").style.display = "none";
  document.getElementById("btnSave").style.display = "inline-block";
  // validate
  const errEl = document.getElementById("jsonError");
  try {
    JSON.parse(this.value);
    errEl.classList.remove("show");
  } catch {
    errEl.classList.add("show");
  }
});

async function saveConfig() {
  if (!currentName) return;
  const val = document.getElementById("editor").value;
  try {
    const content = JSON.parse(val);
    await api("PUT", `api/configs/${currentName}`, { content });
    toast(t("saveSuccess"), "success");
    editing = false; isDirty = false;
    document.getElementById("btnSwitch").style.display = "inline-block";
    document.getElementById("btnSave").style.display = "none";
    await loadConfigs();
  } catch (e) {
    if (e instanceof SyntaxError) {
      document.getElementById("jsonError").classList.add("show");
      toast(t("saveJsonError"), "error");
    } else {
      toast(translateError(e.message), "error");
    }
  }
}

// --- Delete ---
async function deleteConfig(name) {
  if (!confirm(t("confirmDelete", name))) return;
  try {
    await api("DELETE", `api/configs/${name}`);
    toast(t("deleted", name), "info");
    if (currentName === name) {
      currentName = null;
      document.getElementById("fileName").textContent = t("selectConfig");
      document.getElementById("editor").value = "";
      document.getElementById("editor").readOnly = true;
      document.getElementById("btnSwitch").style.display = "none";
      document.getElementById("btnSave").style.display = "none";
    }
    await loadConfigs();
  } catch (e) {
    toast(translateError(e.message), "error");
  }
}

// --- New ---
function openNewConfig() {
  document.getElementById("newModal").classList.add("show");
  document.getElementById("newConfigName").value = "";
  document.getElementById("newConfigContent").value = t("newConfigPlaceholder");
  document.getElementById("newJsonError").classList.remove("show");
}

function closeNewModal() {
  document.getElementById("newModal").classList.remove("show");
}

async function createConfig() {
  const name = document.getElementById("newConfigName").value.trim();
  const raw = document.getElementById("newConfigContent").value;
  const errEl = document.getElementById("newJsonError");

  if (!name) { toast(t("enterFileName"), "error"); return; }
  try {
    const content = JSON.parse(raw);
    await api("POST", "api/configs", { name, content });
    toast(t("createSuccess", name), "success");
    closeNewModal();
    await loadConfigs();
    selectConfig(name.endsWith(".json") ? name : name + ".json");
  } catch (e) {
    if (e instanceof SyntaxError) {
      errEl.textContent = `${t("jsonErrorPrefix")}: ${e.message}`;
      errEl.classList.add("show");
    } else {
      toast(translateError(e.message), "error");
    }
  }
}

// --- Server Management ---
let currentServer = "local";

async function loadServers() {
  try {
    const data = await api("GET", "api/servers");
    const select = document.getElementById("serverSelect");
    // Keep local option, remove others
    while (select.options.length > 1) select.remove(1);
    for (const s of data.servers) {
      const opt = document.createElement("option");
      opt.value = s.name;
      opt.textContent = `${s.name} (${s.host})`;
      select.appendChild(opt);
    }
    select.value = currentServer;
  } catch (e) {
    console.error("加载服务器列表失败", e);
  }
}

function onServerChange() {
  currentServer = document.getElementById("serverSelect").value;
  loadAll();
}

function openServerModal() {
  document.getElementById("serverModal").classList.add("show");
  loadServerList();
}

function closeServerModal() {
  document.getElementById("serverModal").classList.remove("show");
}

async function loadServerList() {
  try {
    const data = await api("GET", "api/servers");
    const el = document.getElementById("serverList");
    if (data.servers.length === 0) {
      el.innerHTML = '<div class="empty">暂无服务器</div>';
      return;
    }
    let html = "";
    for (const s of data.servers) {
      html += `<div class="config-item" data-name="${s.name}">
        <span class="name">${s.name} <span class="server-badge remote">${s.host}</span></span>
        <span class="actions">
          <button onclick="event.stopPropagation();testServer('${s.name}')" title="测试连接">🔌</button>
          <button class="btn-del" onclick="event.stopPropagation();deleteServer('${s.name}')" title="删除">🗑️</button>
        </span>
      </div>`;
    }
    el.innerHTML = html;
  } catch (e) {
    toast(translateError(e.message), "error");
  }
}

async function addServer() {
  const name = document.getElementById("srvName").value.trim();
  const host = document.getElementById("srvHost").value.trim();
  const port = document.getElementById("srvPort").value;
  const username = document.getElementById("srvUsername").value.trim();
  const keyPath = document.getElementById("srvKeyPath").value.trim();
  const passphrase = document.getElementById("srvPassphrase").value;

  if (!name || !host || !username) {
    toast("请填写名称、主机和用户名", "error");
    return;
  }

  try {
    await api("POST", "api/servers", { name, host, port, username, key_path: keyPath, passphrase });
    toast("添加成功", "success");
    document.getElementById("srvName").value = "";
    document.getElementById("srvHost").value = "";
    document.getElementById("srvUsername").value = "";
    document.getElementById("srvKeyPath").value = "";
    document.getElementById("srvPassphrase").value = "";
    loadServerList();
    loadServers();
  } catch (e) {
    toast(translateError(e.message), "error");
  }
}

async function deleteServer(name) {
  if (!confirm(`确定删除服务器「${name}」吗？`)) return;
  try {
    await api("DELETE", `api/servers/${name}`);
    toast("已删除", "info");
    loadServerList();
    loadServers();
  } catch (e) {
    toast(translateError(e.message), "error");
  }
}

async function testServer(name) {
  try {
    const data = await api("GET", `api/servers/${name}/test`);
    toast(data.message, "success");
  } catch (e) {
    toast(translateError(e.message), "error");
  }
}

// --- Remote Config Loading ---
async function loadRemoteConfigs(serverName) {
  try {
    const data = await api("GET", `api/servers/${serverName}/configs`);
    configs = data.configs || [];
    renderSidebar();
  } catch (e) {
    toast(translateError(e.message), "error");
  }
}

async function loadRemoteCurrent(serverName) {
  try {
    const data = await api("GET", `api/servers/${serverName}/current`);
    const el = document.getElementById("currentInfo");
    const otherEl = document.getElementById("currentOtherFields");
    if (!data.exists) {
      el.innerHTML = `<span style="color:var(--warning)">远程 settings.json 不存在</span>`;
      otherEl.innerHTML = "";
      return;
    }
    const env = data.env || {};
    const other = data.other_fields || {};
    let envHtml = '<table style="width:100%;font-size:13px;border-collapse:collapse">';
    for (const [key, val] of Object.entries(env)) {
      const displayVal = key === 'ANTHROPIC_AUTH_TOKEN' && val.length > 20
        ? val.substring(0, 12) + '...'
        : val;
      envHtml += `<tr style="border-bottom:1px solid var(--border)"><td style="padding:4px 8px 4px 0;color:var(--muted);white-space:nowrap;width:1%">${key}</td><td style="padding:4px 0;font-family:monospace;font-size:12px;word-break:break-all">${displayVal}</td></tr>`;
    }
    envHtml += '</table>';
    el.innerHTML = envHtml;

    let otherHtml = "";
    if (Object.keys(other).length > 0) {
      otherHtml = `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><h3 style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px">${t("otherFields")}</h3><table style="width:100%;font-size:13px;border-collapse:collapse">`;
      for (const [key, val] of Object.entries(other)) {
        const displayVal = typeof val === 'object' ? JSON.stringify(val) : String(val);
        otherHtml += `<tr style="border-bottom:1px solid var(--border)"><td style="padding:4px 8px 4px 0;color:var(--muted);white-space:nowrap;width:1%">${key}</td><td style="padding:4px 0;font-family:monospace;font-size:12px;word-break:break-all">${displayVal}</td></tr>`;
      }
      otherHtml += '</table></div>';
    }
    otherHtml += `<div style="margin-top:8px;font-size:12px;color:var(--muted)">📁 ${data.path}</div>`;
    otherEl.innerHTML = otherHtml;
  } catch (e) {
    document.getElementById("currentInfo").textContent = `${t("readFailed")}: ${translateError(e.message)}`;
  }
}

async function doRemoteSwitch(serverName, configContent) {
  try {
    await api("POST", `api/servers/${serverName}/switch`, { content: configContent });
    toast("切换成功", "success");
    await loadRemoteCurrent(serverName);
  } catch (e) {
    toast(translateError(e.message), "error");
  }
}

// --- Init ---
document.getElementById("fileName").textContent = t("selectConfig");
loadServers();
loadAll();
</script>
</body>
</html>
